name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 苹果包只能在 macOS runner 上出
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *([^+ ]+).*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "VERSION=$V"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: Toolchain
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Dependencies
        run: flutter pub get

      - name: Build (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Ad-hoc sign + package IPA
        run: |
          set -e
          V="${{ steps.ver.outputs.version }}"
          APP=$(find build/ios/iphoneos -maxdepth 2 -name "Runner.app" | head -1)
          echo "APP=$APP"
          ls -la "$APP" | head
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP" || true
          /usr/bin/codesign -dv "$APP" 2>&1 || true
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "DataVision-v${V}.ipa" Payload
          ls -lh "DataVision-v${V}.ipa"
          unzip -l "DataVision-v${V}.ipa" | head -15

      - uses: actions/upload-artifact@v4
        with:
          name: datavision-ipa
          path: DataVision-v${{ steps.ver.outputs.version }}.ipa

      - name: 生成发布说明
        run: python3 tools/release_body.py "${{ steps.ver.outputs.version }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 数据视界 v${{ steps.ver.outputs.version }}
          # 两个 job 共用同一份正文，避免后跑完的把前一个的说明覆盖掉
          body_path: release-body.md
          files: DataVision-v${{ steps.ver.outputs.version }}.ipa
          # 千万别再标 prerelease：/releases/latest 不返回预发布版本，客户端会 404
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 安卓包顺手也在这里出一份，方便不进电脑也能拿到
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *([^+ ]+).*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AGP 9 的 lint 用了 JDK 21 的 API（List.removeLast），17 上跑 lintVital 会
          # NoSuchMethodError，整个 release 构建直接失败
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "DataVision-v${{ steps.ver.outputs.version }}.apk"
          ls -lh DataVision-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: datavision-apk
          path: DataVision-v${{ steps.ver.outputs.version }}.apk

      - name: 生成发布说明
        run: python3 tools/release_body.py "${{ steps.ver.outputs.version }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 数据视界 v${{ steps.ver.outputs.version }}
          body_path: release-body.md
          files: DataVision-v${{ steps.ver.outputs.version }}.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
